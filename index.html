<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .slot-card { transition: all 0.15s ease; }
    .slot-card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08); }
    .slot-selected { outline: 2px solid #4f46e5; outline-offset: 1px; background-color: #eef2ff !important; }
    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
      .print-container { box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; }

    // Calculate bell schedule timeline for a tier
    function computeBellSchedule(tier) {
      const slots = [];
      let [hh, mm] = (tier.startTime || '08:00').split(':').map(Number);
      let currentMins = hh * 60 + mm;

      const fmt = (m) => {
        const h24 = Math.floor(m / 60) % 24;
        const mins = m % 60;
        const ampm = h24 >= 12 ? 'PM' : 'AM';
        const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
        return `${String(h12).padStart(2, '0')}:${String(mins).padStart(2, '0')} ${ampm}`;
      };

      if (tier.zeroPeriod && tier.zeroPeriod.enabled) {
        const start = fmt(currentMins);
        currentMins += Number(tier.zeroPeriod.durationMins || 20);
        const end = fmt(currentMins);
        slots.push({ type: 'zero', label: tier.zeroPeriod.label || 'Zero Period', start, end, duration: tier.zeroPeriod.durationMins });
      }

      for (let p = 1; p <= tier.periodsCount; p++) {
        const dur = Number((tier.customPeriodMins && tier.customPeriodMins[p]) || tier.defaultPeriodMins || 45);
        const start = fmt(currentMins);
        currentMins += dur;
        const end = fmt(currentMins);
        slots.push({ type: 'period', period: p, label: `Period ${p}`, start, end, duration: dur });

        if (tier.recess && Number(tier.recess.afterPeriod) === p) {
          const rStart = fmt(currentMins);
          currentMins += Number(tier.recess.durationMins || 15);
          const rEnd = fmt(currentMins);
          slots.push({ type: 'break', label: tier.recess.label || 'Recess', start: rStart, end: rEnd, duration: tier.recess.durationMins });
        }
        if (tier.lunch && Number(tier.lunch.afterPeriod) === p) {
          const lStart = fmt(currentMins);
          currentMins += Number(tier.lunch.durationMins || 35);
          const lEnd = fmt(currentMins);
          slots.push({ type: 'lunch', label: tier.lunch.label || 'Lunch Break', start: lStart, end: lEnd, duration: tier.lunch.durationMins });
        }
      }
      return { slots, endTimeFormatted: fmt(currentMins) };
    }

    // Determine appropriate room for a class + subject
    function resolveRoomForClassSubject(classId, subjectId, entriesAtSlot = []) {
      const cls = getClass(classId);
      const sub = getSubject(subjectId);
      if (!sub) return cls ? cls.homeroomId : 'R_101';
      if (sub.specialRoomType) {
        const candidateRooms = state.rooms.filter(r => r.type === sub.specialRoomType);
        for (const r of candidateRooms) {
          const usedCount = entriesAtSlot.filter(e => e.roomId === r.id && e.classId !== classId).length;
          if (usedCount < (r.capacity || 1)) {
            return r.id;
          }
        }
        if (candidateRooms.length > 0) return candidateRooms[0].id;
      }
      return (cls && cls.homeroomId) ? cls.homeroomId : (state.rooms[0] ? state.rooms[0].id : 'R_101');
    }

    // Calculate teacher workload from Step 8 assignments
    function computeTeacherAssignedWorkload(teacherId) {
      let totalPeriods = 0;
      const breakdown = [];
      for (const cls of state.classes) {
        const reqs = state.gradeRequirements[cls.gradeId] || {};
        for (const [subId, count] of Object.entries(reqs)) {
          if (count > 0 && state.assignments[`${cls.id}__${subId}`] === teacherId) {
            totalPeriods += Number(count);
            breakdown.push({ classId: cls.id, className: cls.name, subjectId: subId, periods: Number(count) });
          }
        }
      }
      return { totalPeriods, breakdown };
    }

    // =========================================================================
    // STEP 10 & PRE-GENERATION READINESS CHECKER
    // =========================================================================
    function runReadinessReport() {
      const blockers = []; // Red errors that block generation
      const warnings = []; // Yellow warnings

      const daysCount = state.school.workingDays.length;

      // 1. Check each grade's weekly period total vs available slots
      for (const grade of state.grades) {
        const tier = state.tiers.find(t => t.id === grade.tierId) || state.tiers[0];
        const blockedCount = state.specialRules.blockedSlots.filter(b => b.active).length;
        const availableSlots = daysCount * tier.periodsCount - blockedCount;
        const reqs = state.gradeRequirements[grade.id] || {};
        const sumReqs = Object.values(reqs).reduce((a, b) => a + Number(b || 0), 0);
        if (sumReqs > availableSlots) {
          blockers.push({
            step: 6,
            title: `${grade.name}: Weekly periods exceed available bell slots`,
            detail: `${grade.name} requires ${sumReqs} periods/week, but only ${availableSlots} teaching periods are available (${daysCount} days × ${tier.periodsCount} periods${blockedCount ? ' minus ' + blockedCount + ' blocked' : ''}).`
          });
        } else if (sumReqs < availableSlots) {
          warnings.push({
            step: 6,
            title: `${grade.name}: ${availableSlots - sumReqs} free/unassigned slot(s) per week`,
            detail: `${grade.name} defines ${sumReqs} weekly periods out of ${availableSlots} available slots.`
          });
        }
      }

      // 2. Check Step 8 Teacher Assignments (every required class+subject must have a teacher)
      for (const cls of state.classes) {
        const reqs = state.gradeRequirements[cls.gradeId] || {};
        for (const [subId, count] of Object.entries(reqs)) {
          if (Number(count) <= 0) continue;
          const tId = state.assignments[`${cls.id}__${subId}`];
          const sub = getSubject(subId);
          if (!tId) {
            blockers.push({
              step: 8,
              title: `Missing Teacher Assignment: Class ${cls.name} — ${sub ? sub.name : subId}`,
              detail: `Class ${cls.name} requires ${count} periods/week of ${sub ? sub.name : subId}, but no teacher is assigned in Step 8.`
            });
          } else {
            const teacher = getTeacher(tId);
            if (!teacher) {
              blockers.push({
                step: 8,
                title: `Invalid Teacher Assigned: Class ${cls.name} — ${sub ? sub.name : subId}`,
                detail: `Assigned teacher ID ${tId} no longer exists.`
              });
            } else {
              if (!teacher.subjects.includes(subId)) {
                warnings.push({
                  step: 8,
                  title: `Qualification Warning: ${teacher.name} assigned to ${sub ? sub.name : subId} (${cls.name})`,
                  detail: `${teacher.name} does not list ${sub ? sub.name : subId} in their primary subject qualifications.`
                });
              }
              if (!teacher.grades.includes(cls.gradeId)) {
                warnings.push({
                  step: 8,
                  title: `Grade Tier Warning: ${teacher.name} assigned to ${cls.name}`,
                  detail: `${teacher.name} is not marked for ${cls.gradeId} in Step 7.`
                });
              }
            }
          }
        }
      }

      // 3. Check Teacher Workload vs Max Weekly Capacity
      for (const teacher of state.teachers) {
        const { totalPeriods } = computeTeacherAssignedWorkload(teacher.id);
        if (totalPeriods > teacher.maxPerWeek) {
          blockers.push({
            step: 8,
            title: `Teacher Overloaded: ${teacher.name} (${totalPeriods}/${teacher.maxPerWeek} periods/wk)`,
            detail: `${teacher.name} is assigned ${totalPeriods} weekly periods in Step 8, exceeding their maximum weekly limit of ${teacher.maxPerWeek}.`
          });
        } else if (totalPeriods > teacher.maxPerWeek * 0.9 && totalPeriods > 0) {
          warnings.push({
            step: 8,
            title: `High Workload: ${teacher.name} at ${Math.round((totalPeriods / teacher.maxPerWeek) * 100)}% capacity`,
            detail: `${teacher.name} has ${totalPeriods}/${teacher.maxPerWeek} periods/week, leaving minimal buffer for substitutions.`
          });
        }
      }

      // 4. Check Special Room Capacity vs Weekly Demand
      const roomTypes = ['Science Lab', 'Computer Lab', 'Art Room', 'Music Room', 'Playground'];
      for (const rType of roomTypes) {
        const roomsOfType = state.rooms.filter(r => r.type === rType);
        const totalCapPerSlot = roomsOfType.reduce((acc, r) => acc + Number(r.capacity || 1), 0);
        const maxWeeklySlots = totalCapPerSlot * daysCount * 7;
        let requiredRoomPeriods = 0;
        for (const cls of state.classes) {
          const reqs = state.gradeRequirements[cls.gradeId] || {};
          for (const [subId, count] of Object.entries(reqs)) {
            const sub = getSubject(subId);
            if (sub && sub.specialRoomType === rType) {
              requiredRoomPeriods += Number(count || 0);
            }
          }
        }
        if (requiredRoomPeriods > maxWeeklySlots) {
          blockers.push({
            step: 4,
            title: `Room Bottleneck: ${rType} demand (${requiredRoomPeriods}p) exceeds capacity (${maxWeeklySlots}p)`,
            detail: `Add another ${rType} or increase room capacity in Step 4.`
          });
        }
      }

      return { blockers, warnings, ready: blockers.length === 0 };
    }

    // =========================================================================
    // SHARED RULE CHECKER (Used by both Automated Generation & Manual Studio Edits)
    // =========================================================================
    function validateCandidatePlacement(entries, candidate, options = { ignorePinned: false }) {
      // candidate: { classId, day, period, subjectId, teacherId, roomId }
      const hardViolations = [];
      const softWarnings = [];

      const cls = getClass(candidate.classId);
      const sub = getSubject(candidate.subjectId);
      const teacher = getTeacher(candidate.teacherId);
      const room = getRoom(candidate.roomId);
      const tier = getTierForClass(candidate.classId);

      // 1. Valid period for class's tier
      if (candidate.period < 1 || candidate.period > tier.periodsCount) {
        hardViolations.push(`Period ${candidate.period} is outside ${tier.name} bell schedule (1–${tier.periodsCount}).`);
      }

      // 2. Blocked slot check
      const blocked = state.specialRules.blockedSlots.find(b => b.active && b.day === candidate.day && Number(b.period) === Number(candidate.period));
      if (blocked) {
        hardViolations.push(`${candidate.day} Period ${candidate.period} is blocked for "${blocked.label}".`);
      }

      // 3. Pinned slot protection
      if (!options.ignorePinned) {
        const existingInClassSlot = entries.find(e => e.classId === candidate.classId && e.day === candidate.day && e.period === candidate.period);
        if (existingInClassSlot && existingInClassSlot.locked && (existingInClassSlot.subjectId !== candidate.subjectId || existingInClassSlot.teacherId !== candidate.teacherId)) {
          hardViolations.push(`${cls ? cls.name : candidate.classId} ${candidate.day} P${candidate.period} is locked/pinned to ${getSubject(existingInClassSlot.subjectId)?.name || 'another lesson'}.`);
        }
      }

      // 4. Teacher clash (same day & period in another class)
      const teacherClash = entries.find(e =>
        e.day === candidate.day &&
        Number(e.period) === Number(candidate.period) &&
        e.teacherId === candidate.teacherId &&
        e.classId !== candidate.classId
      );
      if (teacherClash) {
        const otherCls = getClass(teacherClash.classId);
        const otherSub = getSubject(teacherClash.subjectId);
        hardViolations.push(`Teacher Clash: ${teacher ? teacher.name : candidate.teacherId} is already teaching ${otherCls ? otherCls.name : teacherClash.classId} (${otherSub ? otherSub.code : ''}) on ${candidate.day} Period ${candidate.period}.`);
      }

      // 5. Room capacity clash
      if (room) {
        const roomUsers = entries.filter(e =>
          e.day === candidate.day &&
          Number(e.period) === Number(candidate.period) &&
          e.roomId === candidate.roomId &&
          e.classId !== candidate.classId
        );
        if (roomUsers.length >= (room.capacity || 1)) {
          const otherNames = roomUsers.map(u => getClass(u.classId)?.name || u.classId).join(', ');
          hardViolations.push(`Room Capacity Clash: ${room.name} (capacity ${room.capacity}) is already occupied by Class ${otherNames} on ${candidate.day} Period ${candidate.period}.`);
        }
      }

      // 6. Teacher Availability & Limits (Daily limit, Weekly limit, Consecutive limit)
      if (teacher) {
        if (!teacher.availableDays.includes(candidate.day)) {
          hardViolations.push(`Teacher Unavailable: ${teacher.name} does not work on ${candidate.day}.`);
        }
        if ((teacher.unavailableSlots || []).includes(`${candidate.day}-${candidate.period}`)) {
          hardViolations.push(`Teacher Unavailable: ${teacher.name} marked ${candidate.day} Period ${candidate.period} as unavailable.`);
        }

        const teacherDayEntries = entries.filter(e =>
          e.teacherId === candidate.teacherId &&
          e.day === candidate.day &&
          !(e.classId === candidate.classId && Number(e.period) === Number(candidate.period))
        );
        if (teacherDayEntries.length + 1 > teacher.maxPerDay) {
          hardViolations.push(`Daily Limit Exceeded: ${teacher.name} already has ${teacherDayEntries.length} periods on ${candidate.day} (max ${teacher.maxPerDay}/day).`);
        }

        // Check max consecutive periods in a row
        const occupiedPeriods = new Set(teacherDayEntries.map(e => Number(e.period)));
        occupiedPeriods.add(Number(candidate.period));
        let streak = 0;
        let maxStreak = 0;
        for (let p = 1; p <= 8; p++) {
          if (occupiedPeriods.has(p)) {
            streak++;
            if (streak > maxStreak) maxStreak = streak;
          } else {
            streak = 0;
          }
        }
        if (maxStreak > (teacher.maxConsecutive || 4)) {
          hardViolations.push(`Consecutive Limit: ${teacher.name} would teach ${maxStreak} periods in a row on ${candidate.day} (max ${teacher.maxConsecutive} in a row).`);
        }

        // Qualification check
        if (!teacher.subjects.includes(candidate.subjectId)) {
          softWarnings.push(`Qualification Notice: ${teacher.name} is not listed as primary faculty for ${sub ? sub.name : candidate.subjectId}.`);
        }
      }

      // 7. Soft Rules Checks
      const classDayEntries = entries.filter(e =>
        e.classId === candidate.classId &&
        e.day === candidate.day &&
        Number(e.period) !== Number(candidate.period)
      );
      const sameSubToday = classDayEntries.filter(e => e.subjectId === candidate.subjectId);
      if (sub && !sub.doublePeriod && sameSubToday.length >= 1 && state.specialRules.softRules.spreadSubjectAcrossWeek) {
        softWarnings.push(`Soft Rule (Spread Across Week): Class ${cls ? cls.name : ''} already has ${sub.name} on ${candidate.day} (Period ${sameSubToday.map(x => x.period).join(', ')}).`);
      }
      if (sub && !sub.doublePeriod && state.specialRules.softRules.avoidBackToBackSameSubject) {
        const adjacent = sameSubToday.find(e => Math.abs(Number(e.period) - Number(candidate.period)) === 1);
        if (adjacent) {
          softWarnings.push(`Soft Rule (Back-to-Back): ${sub.name} is placed back-to-back with Period ${adjacent.period} for a non-double subject.`);
        }
      }
      if (sub && sub.heavy && candidate.period >= 6 && state.specialRules.softRules.heavySubjectsEarly) {
        softWarnings.push(`Soft Rule (Heavy Subject Early): ${sub.name} is a core heavy subject placed late in the day (Period ${candidate.period}).`);
      }

      return {
        ok: hardViolations.length === 0,
        hardViolations,
        softWarnings
      };
    }

    // =========================================================================
    // AUTOMATED SOLVER ENGINE (Layer B: Places Lessons inside Hard & Soft Rules)
    // =========================================================================
    function generateTimetableEntries(existingEntries = [], filterScope = null) {
      // filterScope can be null (full generation) or { type: 'class' | 'teacher' | 'day', targetId: '...' }
      const workingDays = state.school.workingDays;
      let entries = [];

      // Keep locked/pinned entries AND entries outside partial-regeneration scope
      for (const e of existingEntries) {
        if (e.locked) {
          entries.push(Object.assign({}, e));
          continue;
        }
        if (filterScope) {
          if (filterScope.type === 'class' && e.classId !== filterScope.targetId) {
            entries.push(Object.assign({}, e));
          } else if (filterScope.type === 'teacher' && e.teacherId !== filterScope.targetId) {
            entries.push(Object.assign({}, e));
          } else if (filterScope.type === 'day' && e.day !== filterScope.targetId) {
            entries.push(Object.assign({}, e));
          }
        }
      }

      // Ensure Step 9 explicit pinnedLessons are present and locked
      for (const pin of state.specialRules.pinnedLessons) {
        if (filterScope && filterScope.type === 'class' && pin.classId !== filterScope.targetId) continue;
        const already = entries.find(e => e.classId === pin.classId && e.day === pin.day && Number(e.period) === Number(pin.period));
        if (!already) {
          const tId = state.assignments[`${pin.classId}__${pin.subjectId}`] || 'T1';
          const slotEntries = entries.filter(e => e.day === pin.day && Number(e.period) === Number(pin.period));
          const rId = resolveRoomForClassSubject(pin.classId, pin.subjectId, slotEntries);
          entries.push({
            id: `E_${pin.classId}_${pin.day}_${pin.period}`,
            classId: pin.classId,
            day: pin.day,
            period: Number(pin.period),
            subjectId: pin.subjectId,
            teacherId: tId,
            roomId: rId,
            locked: true
          });
        }
      }

      // Build list of remaining lesson tokens to place per class
      const tokens = [];
      for (const cls of state.classes) {
        if (filterScope && filterScope.type === 'class' && cls.id !== filterScope.targetId) continue;
        const reqs = state.gradeRequirements[cls.gradeId] || {};
        for (const [subId, reqCount] of Object.entries(reqs)) {
          const totalNeeded = Number(reqCount || 0);
          if (totalNeeded <= 0) continue;
          const teacherId = state.assignments[`${cls.id}__${subId}`];
          if (filterScope && filterScope.type === 'teacher' && teacherId !== filterScope.targetId) continue;

          const alreadyPlaced = entries.filter(e => e.classId === cls.id && e.subjectId === subId).length;
          let remaining = totalNeeded - alreadyPlaced;
          const sub = getSubject(subId);

          while (remaining > 0) {
            if (sub && sub.doublePeriod && remaining >= 2 && state.specialRules.softRules.doublePeriodsForLabs) {
              tokens.push({ classId: cls.id, subjectId: subId, teacherId, isDouble: true, priority: 100 });
              remaining -= 2;
            } else {
              const priority = (sub && sub.specialRoomType ? 80 : 0) + (sub && sub.heavy ? 40 : 10);
              tokens.push({ classId: cls.id, subjectId: subId, teacherId, isDouble: false, priority });
              remaining -= 1;
            }
          }
        }
      }

      // Sort tokens: double periods & special rooms first, then heavier subjects
      tokens.sort((a, b) => b.priority - a.priority);

      const unplaced = [];

      // Place double-period tokens first
      for (const tok of tokens.filter(t => t.isDouble)) {
        let placed = false;
        const tier = getTierForClass(tok.classId);
        for (const day of workingDays) {
          if (filterScope && filterScope.type === 'day' && day !== filterScope.targetId) continue;
          for (let p = 1; p < tier.periodsCount; p++) {
            // Avoid spanning across lunch if possible
            if (tier.lunch && Number(tier.lunch.afterPeriod) === p) continue;
            const slotOccupied1 = entries.some(e => e.classId === tok.classId && e.day === day && e.period === p);
            const slotOccupied2 = entries.some(e => e.classId === tok.classId && e.day === day && e.period === p + 1);
            if (slotOccupied1 || slotOccupied2) continue;

            const slotEntries1 = entries.filter(e => e.day === day && e.period === p);
            const slotEntries2 = entries.filter(e => e.day === day && e.period === p + 1);
            const r1 = resolveRoomForClassSubject(tok.classId, tok.subjectId, slotEntries1);
            const r2 = resolveRoomForClassSubject(tok.classId, tok.subjectId, slotEntries2);
            if (r1 !== r2) continue;

            const c1 = { classId: tok.classId, day, period: p, subjectId: tok.subjectId, teacherId: tok.teacherId, roomId: r1 };
            const v1 = validateCandidatePlacement(entries, c1);
            if (!v1.ok) continue;

            const tempEntries = entries.concat([{ id: 'TEMP', ...c1, locked: false }]);
            const c2 = { classId: tok.classId, day, period: p + 1, subjectId: tok.subjectId, teacherId: tok.teacherId, roomId: r2 };
            const v2 = validateCandidatePlacement(tempEntries, c2);
            if (v2.ok) {
              entries.push({ id: `E_${tok.classId}_${day}_${p}`, ...c1, locked: false });
              entries.push({ id: `E_${tok.classId}_${day}_${p + 1}`, ...c2, locked: false });
              placed = true;
              break;
            }
          }
          if (placed) break;
        }
        if (!placed) {
          // Split into two single tokens if double slot unavailable
          tokens.push({ classId: tok.classId, subjectId: tok.subjectId, teacherId: tok.teacherId, isDouble: false, priority: 90 });
          tokens.push({ classId: tok.classId, subjectId: tok.subjectId, teacherId: tok.teacherId, isDouble: false, priority: 90 });
        }
      }

      // Place single-period tokens using soft-rule scoring
      for (const tok of tokens.filter(t => !t.isDouble)) {
        const tier = getTierForClass(tok.classId);
        const sub = getSubject(tok.subjectId);
        let bestCandidate = null;
        let bestScore = -999999;

        for (const day of workingDays) {
          if (filterScope && filterScope.type === 'day' && day !== filterScope.targetId) continue;
          for (let p = 1; p <= tier.periodsCount; p++) {
            const occupied = entries.some(e => e.classId === tok.classId && e.day === day && e.period === p);
            if (occupied) continue;

            const slotEntries = entries.filter(e => e.day === day && e.period === p);
            const roomId = resolveRoomForClassSubject(tok.classId, tok.subjectId, slotEntries);
            const cand = { classId: tok.classId, day, period: p, subjectId: tok.subjectId, teacherId: tok.teacherId, roomId };
            const check = validateCandidatePlacement(entries, cand);

            let score = 100;
            if (!check.ok) {
              // Only consider relaxed daily/consecutive teacher limit if no strict slot exists
              const fatal = check.hardViolations.some(msg => msg.includes('Teacher Clash') || msg.includes('Room Capacity Clash') || msg.includes('blocked'));
              if (fatal) continue;
              score -= 500 * check.hardViolations.length;
            }

            // Soft rule scoring
            const sameSubOnDay = entries.filter(e => e.classId === tok.classId && e.day === day && e.subjectId === tok.subjectId).length;
            if (state.specialRules.softRules.spreadSubjectAcrossWeek) {
              score -= sameSubOnDay * 45;
            }
            if (state.specialRules.softRules.heavySubjectsEarly) {
              if (sub && sub.heavy) {
                score += (8 - p) * 6;
              } else if (sub && sub.type === 'Activity') {
                score += p * 5;
              }
            }
            if (state.specialRules.softRules.balanceTeacherDailyLoad) {
              const tLoadOnDay = entries.filter(e => e.teacherId === tok.teacherId && e.day === day).length;
              score -= tLoadOnDay * 8;
            }
            if (state.specialRules.compactClassDay) {
              score += (8 - p) * 2;
            }

            if (score > bestScore) {
              bestScore = score;
              bestCandidate = cand;
            }
          }
        }

        if (bestCandidate) {
          entries.push({
            id: `E_${bestCandidate.classId}_${bestCandidate.day}_${bestCandidate.period}`,
            ...bestCandidate,
            locked: false
          });
        } else {
          unplaced.push(tok);
        }
      }

      // Compute Quality Report
      const qualityReport = computeQualityReport(entries, unplaced);
      return { entries, unplaced, qualityReport };
    }

    function computeQualityReport(entries, unplaced = []) {
      let emptyMiddlePeriods = 0;
      let heavyEarlyHits = 0;
      let heavyTotal = 0;
      let subjectSpreadHits = 0;
      let subjectSpreadChecks = 0;

      for (const cls of state.classes) {
        const tier = getTierForClass(cls.id);
        for (const day of state.school.workingDays) {
          const dayEntries = entries.filter(e => e.classId === cls.id && e.day === day);
          const occupiedP = dayEntries.map(e => Number(e.period)).sort((a, b) => a - b);
          if (occupiedP.length > 1) {
            const minP = occupiedP[0];
            const maxP = occupiedP[occupiedP.length - 1];
            for (let p = minP; p <= maxP; p++) {
              if (!occupiedP.includes(p)) emptyMiddlePeriods++;
            }
          }
          // Check spread
          const bySub = {};
          for (const e of dayEntries) {
            bySub[e.subjectId] = (bySub[e.subjectId] || 0) + 1;
            const sub = getSubject(e.subjectId);
            if (sub && sub.heavy) {
              heavyTotal++;
              if (e.period <= 4) heavyEarlyHits++;
            }
          }
          for (const [subId, cnt] of Object.entries(bySub)) {
            const sub = getSubject(subId);
            if (sub && !sub.doublePeriod) {
              subjectSpreadChecks++;
              if (cnt <= 2) subjectSpreadHits++;
            }
          }
        }
      }

      const spreadPct = subjectSpreadChecks > 0 ? Math.round((subjectSpreadHits / subjectSpreadChecks) * 100) : 100;
      const heavyPct = heavyTotal > 0 ? Math.round((heavyEarlyHits / heavyTotal) * 100) : 95;
      const softScore = Math.max(75, Math.min(100, Math.round(spreadPct * 0.5 + heavyPct * 0.35 + (emptyMiddlePeriods === 0 ? 15 : 8) - unplaced.length * 5)));

      return {
        timestamp: '2026-10-19 08:05 AM',
        totalPlaced: entries.length,
        unplacedCount: unplaced.length,
        emptyMiddlePeriods,
        spreadCompliancePct: spreadPct,
        heavyEarlyPct: heavyPct,
        softRuleScore: softScore
      };
    }

    // =========================================================================
    // SMART SUBSTITUTE RANKING ENGINE (Section 8 — 5-Step Priority Order)
    // =========================================================================
    function getRankedSubstitutesForSlot(absence, entry) {
      // entry: { classId, day, period, subjectId, teacherId, roomId }
      const ver = getPublishedVersion();
      const allEntries = ver ? ver.entries : [];
      const day = entry.day;
      const period = Number(entry.period);

      // Find all teachers absent on this date & period
      const absentTeacherIds = new Set(
        state.absences
          .filter(a => a.date === absence.date && a.status !== 'Rejected' && a.periods.includes(period))
          .map(a => a.teacherId)
      );

      // Find teachers already substituting in another class on this date & period
      const busySubTeacherIds = new Set();
      for (const [key, subObj] of Object.entries(state.substitutions)) {
        const [absId, cId, d, p] = key.split('__');
        const abs = state.absences.find(a => a.id === absId);
        if (abs && abs.date === absence.date && Number(p) === period && cId !== entry.classId) {
          busySubTeacherIds.add(subObj.subTeacherId);
        }
      }

      const candidates = [];

      for (const t of state.teachers) {
        if (t.id === entry.teacherId) continue;

        // Criterion 1: Present, available, free in that period, not already substituting
        const isAbsent = absentTeacherIds.has(t.id);
        const isTeachingNow = allEntries.some(e => e.day === day && Number(e.period) === period && e.teacherId === t.id);
        const isSubbingNow = busySubTeacherIds.has(t.id);
        const isDayAvail = t.availableDays.includes(day) && !(t.unavailableSlots || []).includes(`${day}-${period}`);
        const isFreeAndPresent = !isAbsent && !isTeachingNow && !isSubbingNow && isDayAvail;

        // Criterion 2: Within daily limit (regular teaching today + existing subs today < maxPerDay)
        const teachingTodayCount = allEntries.filter(e => e.day === day && e.teacherId === t.id).length;
        let subbingTodayCount = 0;
        for (const [key, subObj] of Object.entries(state.substitutions)) {
          const [absId, cId, d, p] = key.split('__');
          const abs = state.absences.find(a => a.id === absId);
          if (abs && abs.date === absence.date && subObj.subTeacherId === t.id && !(cId === entry.classId && Number(p) === period)) {
            subbingTodayCount++;
          }
        }
        const totalTodayLoad = teachingTodayCount + subbingTodayCount;
        const withinDailyLimit = totalTodayLoad < t.maxPerDay;
        const freePeriodsToday = Math.max(0, 7 - totalTodayLoad);

        // Criterion 3: Qualified for the subject
        const isQualified = t.subjects.includes(entry.subjectId);

        // Criterion 4: Fewest substitutions so far (fairness)
        const totalSubsSoFar = Number(t.subCount || 0) + subbingTodayCount;

        // Compute Composite Priority Score respecting Pilot Policy (Section 13 Decision #3)
        let score = 0;
        if (isFreeAndPresent) score += 1000;
        if (withinDailyLimit) score += 400;

        if (state.pilotPolicies.substitutePriorityOrder === 'free_most_first') {
          score += freePeriodsToday * 45;
          if (isQualified) score += 120;
        } else {
          // Default: Qualification first, then fairness, then free periods
          if (isQualified) score += 220;
          score += Math.max(0, (10 - totalSubsSoFar) * 20);
          score += freePeriodsToday * 15;
        }

        candidates.push({
          teacher: t,
          isFreeAndPresent,
          withinDailyLimit,
          isQualified,
          totalSubsSoFar,
          freePeriodsToday,
          totalTodayLoad,
          score,
          statusReason: !isFreeAndPresent
            ? (isAbsent ? 'Absent on this date' : isTeachingNow ? 'Teaching another class' : isSubbingNow ? 'Already substituting' : 'Unavailable slot')
            : (!withinDailyLimit ? `At daily max (${totalTodayLoad}/${t.maxPerDay})` : 'Eligible')
        });
      }

      candidates.sort((a, b) => b.score - a.score);
      return candidates;
    }

                              !assignedId ? 'border-rose-400 bg-rose-50 text-rose-800' :

                              'border-slate-300 bg-white text-slate-800'
                            }">
                              <option value="">-- Unassigned --</option>
                              ${state.teachers.map(t => {
                                const qual = t.subjects.includes(sub.id) && t.grades.includes(cls.gradeId);
                                return `<option value="${t.id}" ${t.id === assignedId ? 'selected' : ''}>${qual ? '★ ' : ''}${t.name}</option>`;
                              }).join('')}
                            </select>
                          </td>
                        `;
                      }).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (step === 9) {
        const sr = state.specialRules.softRules;
        return `
          <div class="space-y-5">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">Step 9 — Special Rules, Pinned Lessons, Activity Blocks &amp; Soft Rules</h2>
              <p class="text-xs text-slate-500">Configure pinned lessons, blocked assembly slots, staggered activity blocks, and switch soft preferences on or off.</p>
            </div>

            <!-- Soft Rule Toggles -->
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-700 mb-3">Soft Rules (Solver Preferences — Switch On or Off)</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-xs">
                <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-white border border-slate-200 cursor-pointer">
                  <input type="checkbox" data-soft-rule="spreadSubjectAcrossWeek" ${sr.spreadSubjectAcrossWeek ? 'checked' : ''} class="rounded border-slate-300" />
                  <span><strong>Spread Subject Across Week</strong> (avoid clustering on same day)</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-white border border-slate-200 cursor-pointer">
                  <input type="checkbox" data-soft-rule="heavySubjectsEarly" ${sr.heavySubjectsEarly ? 'checked' : ''} class="rounded border-slate-300" />
                  <span><strong>Heavy Subjects Earlier</strong> (Math/Science in Periods 1–4)</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-white border border-slate-200 cursor-pointer">
                  <input type="checkbox" data-soft-rule="balanceTeacherDailyLoad" ${sr.balanceTeacherDailyLoad ? 'checked' : ''} class="rounded border-slate-300" />
                  <span><strong>Balance Teacher Daily Load</strong> across Mon–Fri</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-white border border-slate-200 cursor-pointer">
                  <input type="checkbox" data-soft-rule="avoidTeacherEmptyGaps" ${sr.avoidTeacherEmptyGaps ? 'checked' : ''} class="rounded border-slate-300" />
                  <span><strong>Minimize Empty Gaps</strong> for teachers</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-white border border-slate-200 cursor-pointer">
                  <input type="checkbox" data-soft-rule="doublePeriodsForLabs" ${sr.doublePeriodsForLabs ? 'checked' : ''} class="rounded border-slate-300" />
                  <span><strong>Double Contiguous Periods</strong> for Science Labs</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-white border border-slate-200 cursor-pointer">
                  <input type="checkbox" data-soft-rule="avoidBackToBackSameSubject" ${sr.avoidBackToBackSameSubject ? 'checked' : ''} class="rounded border-slate-300" />
                  <span><strong>Avoid Same Subject Back-to-Back</strong> (non-labs)</span>
                </label>
              </div>
            </div>

            <!-- Add Pinned Lesson -->
            <div class="p-4 rounded-xl bg-white border border-slate-200 space-y-3">
              <div class="text-xs font-bold text-slate-800 uppercase tracking-wider">Fixed / Pinned Lessons (Never Moved by Solver)</div>
              <div class="flex flex-wrap items-end gap-2 text-xs bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div>
                  <label class="block text-[11px] font-semibold text-slate-600 mb-1">Class</label>
                  <select id="inpPinClass" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white">
                    ${state.classes.map(c => `<option value="${c.id}">Class ${c.name}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-slate-600 mb-1">Subject</label>
                  <select id="inpPinSubject" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white">
                    ${state.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-slate-600 mb-1">Day</label>
                  <select id="inpPinDay" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white">
                    ${state.school.workingDays.map(d => `<option value="${d}">${d}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-slate-600 mb-1">Period</label>
                  <input type="number" id="inpPinPeriod" value="1" min="1" max="7" class="w-16 px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white" />
                </div>
                <div class="flex-1 min-w-[140px]">
                  <label class="block text-[11px] font-semibold text-slate-600 mb-1">Note / Reason</label>
                  <input type="text" id="inpPinReason" placeholder="e.g., Fixed Lab / Principal Observation" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white" />
                </div>
                <button type="button" id="btnAddPinRule" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold">
                  📌 Pin Slot
                </button>
              </div>

              <div class="space-y-1.5">
                ${state.specialRules.pinnedLessons.map(pin => {
                  const cls = getClass(pin.classId);
                  const sub = getSubject(pin.subjectId);
                  return `
                    <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs">
                      <div>
                        <span class="font-bold text-indigo-700">📌 Class ${cls ? cls.name : pin.classId}</span> •
                        <span class="font-semibold">${sub ? sub.name : pin.subjectId}</span> •
                        <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800 font-bold">${pin.day} P${pin.period}</span>
                        <span class="text-slate-500 ml-2">${pin.reason || ''}</span>
                      </div>
                      <button type="button" data-del-pin="${pin.id}" class="text-rose-600 hover:text-rose-800 font-semibold">Unpin</button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // Step 10: Review and Check
      return `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">Step 10 — Pre-Generation Summary &amp; Readiness Report</h2>
              <p class="text-xs text-slate-500">Comprehensive diagnostic check across Steps 1–9 before running the automated solver.</p>
            </div>
            <button type="button" id="step10BtnGenerate" class="px-5 py-2.5 rounded-xl font-extrabold text-xs shadow-sm transition ${
              readiness.ready ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-200 text-slate-500 cursor-not-allowed'
            }">
              ⚡ Run Solver &amp; Generate New Draft Timetable
            </button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-slate-500">Working Days</div>
              <div class="text-base font-extrabold text-slate-900 mt-0.5">${state.school.workingDays.join(', ')}</div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-slate-500">Grades &amp; Classes</div>
              <div class="text-base font-extrabold text-slate-900 mt-0.5">${state.grades.length} Grades / ${state.classes.length} Sections</div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-slate-500">Teachers &amp; Rooms</div>
              <div class="text-base font-extrabold text-slate-900 mt-0.5">${state.teachers.length} Faculty / ${state.rooms.length} Rooms</div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
              <div class="text-slate-500">Pinned Rules</div>
              <div class="text-base font-extrabold text-slate-900 mt-0.5">${state.specialRules.pinnedLessons.length} Fixed Slots</div>
            </div>
          </div>

          <!-- Red Blockers -->
          <div class="space-y-2">
            <h3 class="text-xs font-extrabold uppercase tracking-wider ${readiness.blockers.length === 0 ? 'text-emerald-700' : 'text-rose-700'}">
              Red Readiness Blockers (${readiness.blockers.length})
            </h3>
            ${readiness.blockers.length === 0 ? `
              <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900 font-medium">
                ✓ All mandatory checks passed! Every class-subject has a dedicated teacher, weekly periods match available slots, and no teacher or room is overloaded.
              </div>
            ` : readiness.blockers.map(b => `
              <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-xs flex items-center justify-between gap-3">
                <div>
                  <div class="font-bold text-rose-900">⛔ [Step ${b.step}] ${b.title}</div>
                  <div class="text-rose-700 mt-0.5">${b.detail}</div>
                </div>
                <button type="button" data-wiz-step="${b.step}" class="wiz-step-btn px-3 py-1.5 rounded-lg bg-rose-600 text-white font-bold shrink-0">Go to Step ${b.step}</button>
              </div>
            `).join('')}
          </div>

          <!-- Yellow Warnings -->
          <div class="space-y-2">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-amber-700">
              Yellow Advisory Warnings (${readiness.warnings.length})
            </h3>
            ${readiness.warnings.length === 0 ? `
              <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600">
                ✓ No advisory warnings.
              </div>
            ` : readiness.warnings.map(w => `
              <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs flex items-center justify-between gap-3">
                <div>
                  <div class="font-bold text-amber-900">⚠️ [Step ${w.step}] ${w.title}</div>
                  <div class="text-amber-800 mt-0.5">${w.detail}</div>
                </div>
                <button type="button" data-wiz-step="${w.step}" class="wiz-step-btn px-3 py-1.5 rounded-lg bg-amber-200 text-amber-900 font-bold shrink-0">Review Step ${w.step}</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // 3. INTERACTIVE TIMETABLE STUDIO & SOLVER (Sections 4 & 5)
    // -------------------------------------------------------------------------
    function renderTimetableStudio() {
      const ver = getActiveVersion();
      const entries = ver ? ver.entries : [];
      const qr = state.lastQualityReport || computeQualityReport(entries, []);
      const compareVer = state.versions.find(v => v.id === state.compareVersionId) || state.versions[0];

      return `
        <div class="space-y-5">
          <!-- Top Studio Control Bar -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold ${
                ver.status === 'Published' ? 'bg-emerald-100 text-emerald-800' :
                ver.status === 'Approved' ? 'bg-indigo-100 text-indigo-800' : 'bg-amber-100 text-amber-900'
              }">
                ${ver.status.toUpperCase()}: ${ver.label}
              </span>

              <!-- View Filter Selector -->
              <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
                <button type="button" data-studio-mode="class" class="px-2.5 py-1 rounded-lg font-bold ${state.studioFilterType === 'class' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600'}">By Class</button>
                <button type="button" data-studio-mode="teacher" class="px-2.5 py-1 rounded-lg font-bold ${state.studioFilterType === 'teacher' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600'}">By Teacher</button>
                <button type="button" data-studio-mode="room" class="px-2.5 py-1 rounded-lg font-bold ${state.studioFilterType === 'room' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600'}">By Room</button>
              </div>

              <!-- Target Entity Dropdown -->
              <select id="studioEntitySelect" class="px-3 py-1.5 rounded-xl border border-slate-300 bg-white text-xs font-bold text-slate-800">
                ${state.studioFilterType === 'class'
                  ? state.classes.map(c => `<option value="${c.id}" ${c.id === state.studioFilterId ? 'selected' : ''}>Class ${c.name} (${getGrade(c.gradeId)?.name || ''})</option>`).join('')
                  : state.studioFilterType === 'teacher'
                  ? state.teachers.map(t => `<option value="${t.id}" ${t.id === state.studioFilterId ? 'selected' : ''}>${t.name}</option>`).join('')
                  : state.rooms.map(r => `<option value="${r.id}" ${r.id === state.studioFilterId ? 'selected' : ''}>${r.name} (Cap: ${r.capacity})</option>`).join('')
                }
              </select>
            </div>

            <!-- Studio Action Buttons: Undo, Redo, Compare, Partial Regen, Full Regen -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
              <button type="button" id="btnStudioUndo" ${state.undoStack.length === 0 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg border border-slate-300 font-semibold ${state.undoStack.length === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100 text-slate-700'}">
                ↶ Undo (${state.undoStack.length})
              </button>
              <button type="button" id="btnStudioRedo" ${state.redoStack.length === 0 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg border border-slate-300 font-semibold ${state.redoStack.length === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100 text-slate-700'}">
                ↷ Redo (${state.redoStack.length})
              </button>
              <button type="button" id="btnToggleCompare" class="px-3 py-1.5 rounded-lg border font-semibold ${state.compareMode ? 'bg-amber-100 border-amber-400 text-amber-900' : 'border-slate-300 hover:bg-slate-100 text-slate-700'}">
                ⇄ ${state.compareMode ? 'Exit Diff Compare' : 'Compare Versions'}
              </button>
              <button type="button" id="btnPartialRegenModal" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-semibold">
                ↻ Partial Regenerate
              </button>
              <button type="button" id="btnFullGenerateStudio" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-xs">
                ⚡ Generate Full Draft
              </button>
            </div>
          </div>

          <!-- Solver Quality Report Strip -->
          <div class="bg-slate-900 text-white rounded-2xl p-3.5 px-5 flex flex-wrap items-center justify-between gap-4 text-xs">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-indigo-500/30 text-indigo-300 font-bold">Quality Report</span>
              <span class="text-slate-300">Soft-Rule Score: <strong class="text-emerald-400">${qr.softRuleScore}/100</strong></span>
              <span class="text-slate-600">•</span>
              <span class="text-slate-300">Placed: <strong class="text-white">${qr.totalPlaced} lessons</strong> (${qr.unplacedCount} unplaced)</span>
              <span class="text-slate-600">•</span>
              <span class="text-slate-300">Empty Mid-Day Gaps: <strong class="text-emerald-400">${qr.emptyMiddlePeriods}</strong></span>
              <span class="text-slate-600">•</span>
              <span class="text-slate-300">Weekly Spread Compliance: <strong class="text-indigo-300">${qr.spreadCompliancePct}%</strong></span>
            </div>
            <div class="text-[11px] text-slate-400">
              ${state.studioSelectedSlot
                ? `<span class="text-amber-300 font-bold">📌 Slot Selected (${state.studioSelectedSlot.day} P${state.studioSelectedSlot.period}) — Click any target slot to Move/Swap, or click same slot to cancel!</span>`
                : `💡 Tip: Click any lesson card to inspect/edit, or click "Select to Move/Swap" to relocate with live clash check.`
              }
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Timetable Grid Area -->
            <div class="lg:col-span-9 bg-white rounded-2xl border border-slate-200 shadow-xs p-4 overflow-x-auto">
              ${renderStudioGridTable(ver, compareVer)}
            </div>

            <!-- Right Slot Inspector & Live Rule Validator Panel -->
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 shadow-xs p-4 flex flex-col justify-between">
              ${renderStudioInspectorPanel(ver)}
            </div>
          </div>
        </div>
      `;
    }

    function renderStudioGridTable(ver, compareVer) {
      const entries = ver ? ver.entries : [];
      const compEntries = (state.compareMode && compareVer) ? compareVer.entries : [];
      const workingDays = state.school.workingDays;
      const maxPeriods = 7;

      // Determine tier bell schedule for display
      const activeTier = state.studioFilterType === 'class' ? getTierForClass(state.studioFilterId) : state.tiers[1];
      const bell = computeBellSchedule(activeTier);
      const periodTimes = {};
      bell.slots.filter(s => s.type === 'period').forEach(s => {
        periodTimes[s.period] = `${s.start}–${s.end}`;
      });

      return `
        <table class="w-full border-collapse text-xs min-w-[720px]">
          <thead>
            <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
              <th class="p-2.5 text-left font-extrabold w-24">Day / Period</th>
              ${Array.from({ length: maxPeriods }, (_, idx) => {
                const p = idx + 1;
                const afterRecess = activeTier.recess && Number(activeTier.recess.afterPeriod) === p;
                const afterLunch = activeTier.lunch && Number(activeTier.lunch.afterPeriod) === p;
                return `
                  <th class="p-2.5 text-center font-bold border-l border-slate-200">
                    <div>Period ${p}</div>
                    <div class="text-[10px] font-normal text-slate-500">${periodTimes[p] || ''}</div>
                    ${afterRecess ? `<div class="mt-0.5 text-[9px] px-1 py-0.2 rounded bg-amber-100 text-amber-800 font-semibold">☕ Recess After</div>` : ''}
                    ${afterLunch ? `<div class="mt-0.5 text-[9px] px-1 py-0.2 rounded bg-orange-100 text-orange-800 font-semibold">🍱 Lunch After</div>` : ''}
                  </th>
                `;
              }).join('')}
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">
            ${workingDays.map(day => `
              <tr>
                <td class="p-3 font-extrabold text-slate-900 bg-slate-50/80 whitespace-nowrap">
                  <div>${day}</div>
                  ${state.studioFilterType === 'class' ? `
                    <button type="button" data-regen-day="${day}" class="mt-1 text-[10px] text-indigo-600 hover:underline font-semibold" title="Regenerate only ${day} for this class">↻ Regen Day</button>
                  ` : ''}
                </td>
                ${Array.from({ length: maxPeriods }, (_, idx) => {
                  const p = idx + 1;
                  let slotEntry = null;
                  if (state.studioFilterType === 'class') {
                    slotEntry = entries.find(e => e.classId === state.studioFilterId && e.day === day && Number(e.period) === p);
                  } else if (state.studioFilterType === 'teacher') {
                    slotEntry = entries.find(e => e.teacherId === state.studioFilterId && e.day === day && Number(e.period) === p);
                  } else if (state.studioFilterType === 'room') {
                    slotEntry = entries.find(e => e.roomId === state.studioFilterId && e.day === day && Number(e.period) === p);
                  }

                  const targetClassId = slotEntry ? slotEntry.classId : (state.studioFilterType === 'class' ? state.studioFilterId : 'C_10A');
                  const isSelected = state.studioSelectedSlot && state.studioSelectedSlot.classId === targetClassId && state.studioSelectedSlot.day === day && Number(state.studioSelectedSlot.period) === p;
                  const isInspected = state.studioInspectorSlot && state.studioInspectorSlot.classId === targetClassId && state.studioInspectorSlot.day === day && Number(state.studioInspectorSlot.period) === p;

                  // Check diff in compareMode
                  let diffBadge = '';
                  if (state.compareMode && state.studioFilterType === 'class') {
                    const oldE = compEntries.find(e => e.classId === targetClassId && e.day === day && Number(e.period) === p);
                    if ((!oldE && slotEntry) || (oldE && !slotEntry) || (oldE && slotEntry && (oldE.subjectId !== slotEntry.subjectId || oldE.teacherId !== slotEntry.teacherId))) {
                      const oldSub = oldE ? getSubject(oldE.subjectId)?.code : 'Empty';
                      diffBadge = `<div class="mt-1 px-1.5 py-0.5 rounded bg-amber-200 text-amber-950 text-[10px] font-bold">Diff vs v1: was ${oldSub}</div>`;
                    }
                  }

                  if (!slotEntry) {
                    return `
                      <td class="p-1.5 border-l border-slate-200 align-top">
                        <div data-slot-click="${targetClassId}__${day}__${p}" class="slot-card h-24 rounded-xl border border-dashed border-slate-300 bg-slate-50/50 hover:bg-indigo-50/40 p-2 flex flex-col items-center justify-center text-center cursor-pointer ${isSelected || isInspected ? 'slot-selected' : ''}">
                          <span class="text-[11px] font-semibold text-slate-400">Free / Empty Slot</span>
                          <span class="text-[10px] text-indigo-500 mt-0.5">+ Click to Add / Move Here</span>
                          ${diffBadge}
                        </div>
                      </td>
                    `;
                  }

                  const sub = getSubject(slotEntry.subjectId);
                  const t = getTeacher(slotEntry.teacherId);
                  const r = getRoom(slotEntry.roomId);
                  const cls = getClass(slotEntry.classId);

                  return `
                    <td class="p-1.5 border-l border-slate-200 align-top">
                      <div data-slot-click="${slotEntry.classId}__${day}__${p}" class="slot-card min-h-24 rounded-xl p-2.5 cursor-pointer flex flex-col justify-between border ${isSelected || isInspected ? 'slot-selected' : ''}" style="background:${sub ? sub.bg : '#f8fafc'}; border-color:${sub ? sub.color + '40' : '#e2e8f0'}; color:${sub ? sub.text : '#0f172a'}">
                        <div>
                          <div class="flex items-center justify-between gap-1">
                            <span class="font-extrabold text-xs tracking-tight">${sub ? sub.code : slotEntry.subjectId}</span>
                            <div class="flex items-center gap-1">
                              ${slotEntry.overridden ? `<span class="px-1 py-0.2 rounded bg-rose-600 text-white text-[9px] font-bold" title="Rule Override Applied">OVR</span>` : ''}
                              ${slotEntry.locked ? `<span class="text-xs" title="Pinned / Locked Slot">📌</span>` : ''}
                            </div>
                          </div>
                          <div class="text-[11px] font-semibold truncate mt-0.5">${sub ? sub.name : ''}</div>
                        </div>
                        <div class="mt-2 pt-1.5 border-t border-black/10 text-[10px] space-y-0.5 opacity-90">
                          <div class="font-bold truncate">${state.studioFilterType === 'teacher' ? `Class ${cls ? cls.name : slotEntry.classId}` : (t ? t.name : slotEntry.teacherId)}</div>
                          <div class="truncate opacity-80">📍 ${r ? r.name : slotEntry.roomId}</div>
                        </div>
                        ${diffBadge}

    function renderSimplePrintGrid(entries, mode, targetId, workingDays) {

              </tr>
            </thead>
            <tbody>
              ${workingDays.map(day => `
                <tr>
                  <td class="border border-slate-300 p-2 font-bold bg-slate-50">${day}</td>
                  ${[1, 2, 3, 4, 5, 6, 7].map(p => {
                    const e = entries.find(x =>
                      x.day === day && Number(x.period) === p &&
                      (mode === 'class' ? x.classId === targetId : mode === 'teacher' ? x.teacherId === targetId : x.roomId === targetId)
                    );
                    if (!e) return `<td class="border border-slate-300 p-2 text-center text-slate-400">—</td>`;
                    const sub = getSubject(e.subjectId);
                    const t = getTeacher(e.teacherId);
                    const cls = getClass(e.classId);
                    const r = getRoom(e.roomId);
                    return `
                      <td class="border border-slate-300 p-2 text-center">
                        <div class="font-bold text-slate-900">${sub ? sub.code : e.subjectId}</div>
                        <div class="text-[10px] text-slate-600">${mode === 'teacher' ? `Class ${cls ? cls.name : ''}` : (t ? t.name : '')}</div>
                        <div class="text-[10px] text-slate-500">${r ? r.name : ''}</div>
                      </td>
                    `;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function openModal(title, bodyHtml, footerHtml = '') {
      const backdrop = document.getElementById('modalBackdrop');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      const footerEl = document.getElementById('modalFooter');
      if (!backdrop || !titleEl || !bodyEl || !footerEl) return;
      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHtml;
      footerEl.innerHTML = footerHtml || `<button type="button" id="btnModalDefaultClose" class="px-4 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">Close</button>`;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      const defClose = document.getElementById('btnModalDefaultClose');
      if (defClose) defClose.addEventListener('click', closeModal);
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function pushUndoSnapshot(description) {
      const ver = getActiveVersion();
      if (!ver) return;
      state.undoStack.push({
        versionId: ver.id,
        description,
        entries: JSON.parse(JSON.stringify(ver.entries))
      });
      if (state.undoStack.length > 25) state.undoStack.shift();
      state.redoStack = [];
    }

    function triggerFullTimetableGeneration() {
      const readiness = runReadinessReport();
      if (!readiness.ready) {
        openModal(
          '⛔ Pre-Generation Readiness Check Blocked',
          `<div class="space-y-3">
            <p class="text-xs text-rose-800 bg-rose-50 p-3 rounded-xl border border-rose-200 font-semibold">
              Generation cannot proceed until the following specific readiness issues are resolved:
            </p>
            ${readiness.blockers.map(b => `
              <div class="p-3 rounded-xl border border-rose-200 bg-white">
                <div class="font-bold text-rose-900 text-xs">[Step ${b.step}] ${b.title}</div>
                <div class="text-xs text-slate-600 mt-0.5">${b.detail}</div>
              </div>
            `).join('')}
          </div>`
        );
        return;
      }

      const currentVer = getActiveVersion();
      const lockedEntries = currentVer ? currentVer.entries.filter(e => e.locked) : [];
      const gen = generateTimetableEntries(lockedEntries, null);
      state.lastQualityReport = gen.qualityReport;

      const nextNum = state.versions.reduce((max, v) => Math.max(max, v.versionNumber), 0) + 1;
      const newVerId = `V${nextNum}`;
      const newVer = {
        id: newVerId,
        versionNumber: nextNum,
        label: `v${nextNum}.0 — Auto-Generated Draft`,
        status: 'Draft',
        effectiveDate: '2026-10-26',
        createdBy: 'School Admin',
        createdAt: '2026-10-19 (Just now)',
        softScore: gen.qualityReport.softRuleScore,
        entries: gen.entries
      };
      state.versions.unshift(newVer);
      state.activeVersionId = newVerId;
      addAuditLog('Generation', `Created Draft Version v${nextNum}.0 (${gen.entries.length} lessons placed, Soft Score ${gen.qualityReport.softRuleScore}%).`);
      saveState();
      state.adminTab = 'studio';
      renderApp();
      showToast(`✓ Draft v${nextNum}.0 generated (${gen.entries.length} lessons, ${gen.qualityReport.softRuleScore}% quality score)!`, 'success');
    }

    function handleSlotClickInStudio(classId, day, period) {
      const ver = getActiveVersion();
      if (!ver) return;
      period = Number(period);

      // Always update the right-hand inspector
      state.studioInspectorSlot = { classId, day, period };

      // If a source slot was selected for Move/Swap:
      if (state.studioSelectedSlot) {
        const src = state.studioSelectedSlot;
        if (src.classId === classId && src.day === day && Number(src.period) === period) {
          // Clicked same slot -> cancel move mode
          state.studioSelectedSlot = null;
          renderApp();
          return;
        }
        attemptMoveOrSwapSlots(src, { classId, day, period });
        return;
      }

      renderApp();
    }

    function attemptMoveOrSwapSlots(src, dst, forceOverride = false) {
      const ver = getActiveVersion();
      if (!ver) return;
      const srcEntry = ver.entries.find(e => e.classId === src.classId && e.day === src.day && Number(e.period) === Number(src.period));
      const dstEntry = ver.entries.find(e => e.classId === dst.classId && e.day === dst.day && Number(e.period) === Number(dst.period));

      if (!srcEntry) {
        state.studioSelectedSlot = null;
        renderApp();
        return;
      }

      if ((srcEntry.locked || (dstEntry && dstEntry.locked)) && !forceOverride) {
        openRuleOverrideModal(
          ['One of the selected slots is Pinned/Locked (📌). Moving a locked lesson requires an explicit override.'],
          [],
          () => attemptMoveOrSwapSlots(src, dst, true)
        );
        return;
      }

      // Build trial entries without srcEntry and dstEntry
      const remaining = ver.entries.filter(e =>
        !(e.classId === src.classId && e.day === src.day && Number(e.period) === Number(src.period)) &&
        !(e.classId === dst.classId && e.day === dst.day && Number(e.period) === Number(dst.period))
      );

      const movedSrc = Object.assign({}, srcEntry, {
        classId: dst.classId,
        day: dst.day,
        period: Number(dst.period)
      });
      const check1 = validateCandidatePlacement(remaining, movedSrc, { ignorePinned: true });

      let check2 = { ok: true, hardViolations: [], softWarnings: [] };
      let movedDst = null;
      if (dstEntry) {
        movedDst = Object.assign({}, dstEntry, {
          classId: src.classId,
          day: src.day,
          period: Number(src.period)
        });
        check2 = validateCandidatePlacement(remaining.concat([movedSrc]), movedDst, { ignorePinned: true });
      }

      const allHard = check1.hardViolations.concat(check2.hardViolations);
      const allSoft = check1.softWarnings.concat(check2.softWarnings);

      if (allHard.length > 0 && !forceOverride) {
        openRuleOverrideModal(allHard, allSoft, () => attemptMoveOrSwapSlots(src, dst, true));
        return;
      }

      // Apply Move/Swap
      pushUndoSnapshot(`Swap/Move ${src.day} P${src.period} ↔ ${dst.day} P${dst.period}`);
      movedSrc.id = `E_${movedSrc.classId}_${movedSrc.day}_${movedSrc.period}`;
      if (forceOverride && allHard.length > 0) movedSrc.overridden = true;
      remaining.push(movedSrc);

      if (movedDst) {
        movedDst.id = `E_${movedDst.classId}_${movedDst.day}_${movedDst.period}`;
        if (forceOverride && allHard.length > 0) movedDst.overridden = true;
        remaining.push(movedDst);
      }

      ver.entries = remaining;
      state.studioSelectedSlot = null;
      state.studioInspectorSlot = { classId: dst.classId, day: dst.day, period: Number(dst.period) };

      const actionLabel = dstEntry ? 'Swapped lessons' : 'Moved lesson';
      addAuditLog(
        forceOverride ? 'Rule Override' : 'Manual Edit',
        `${actionLabel} for Class ${getClass(src.classId)?.name || src.classId}: ${src.day} P${src.period} → ${dst.day} P${dst.period}${forceOverride ? ' [OVERRIDDEN: ' + allHard.join('; ') + ']' : ''}.`
      );
      saveState();
      renderApp();
      showToast(`${actionLabel} (${src.day} P${src.period} → ${dst.day} P${dst.period})${allSoft.length ? ' • ' + allSoft[0] : ''}`, forceOverride ? 'warning' : 'success');
    }

    function openRuleOverrideModal(hardViolations, softWarnings, onOverrideConfirm) {
      openModal(
        '⚠️ Rule Checker Alert — Clash or Limit Detected',
        `<div class="space-y-3">
          <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-900 space-y-1">

          <p class="text-xs text-slate-600">

        `<button type="button" id="btnCancelOverride" class="px-3.5 py-1.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold">Cancel Edit</button>
         <button type="button" id="btnConfirmOverride" class="px-4 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold">Override Anyway (Log in Audit History)</button>`

      const cancelBtn = document.getElementById('btnCancelOverride');
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

      };
